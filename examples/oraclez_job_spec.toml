# Oraclez YouTube Stats Job Specifications
# 
# These are example job specifications for integrating with the Oraclez external adapter.
# Copy and modify as needed for your specific use case.
#
# IMPORTANT: Replace the following placeholders:
#   - YOUR_ORACLE_CONTRACT_ADDRESS: Your deployed Oracle contract address
#   - oraclez: Your bridge name (if different)

# ============================================================================
# Job 1: YouTube Video Views Counter
# ============================================================================
# This job fetches YouTube video view counts via the Oraclez adapter.
# It triggers based on configured thresholds (525 initial, then every 5 views).

type = "directrequest"
schemaVersion = 1
name = "YouTube Views Counter - Oraclez"
maxTaskDuration = "0s"
contractAddress = "YOUR_ORACLE_CONTRACT_ADDRESS"
minIncomingConfirmations = 0
observationSource = """
    decode_log   [type="ethabidecodelog"
                  abi="OracleRequest(bytes32 indexed specId, address requester, bytes32 requestId, uint256 payment, address callbackAddr, bytes4 callbackFunctionId, uint256 cancelExpiration, uint256 dataVersion, bytes data)"
                  data="$(jobRun.logData)"
                  topics="$(jobRun.logTopics)"]

    decode_cbor  [type="cborparse" data="$(decode_log.data)"]
    
    fetch        [type="bridge"
                  name="oraclez"
                  requestData="{\\"id\\": $(jobSpec.externalJobID), \\"data\\": {\\"videoId\\": $(decode_cbor.videoId), \\"endpoint\\": \\"views\\"}}"]
    
    parse        [type="jsonparse" path="data,value" data="$(fetch)"]
    
    encode_data  [type="ethabiencode"
                  abi="(uint256 value)"
                  data="{\\"value\\": $(parse)}"]
    
    encode_tx    [type="ethabiencode"
                  abi="fulfillOracleRequest(bytes32 requestId, uint256 payment, address callbackAddress, bytes4 callbackFunctionId, uint256 expiration, bytes32 data)"
                  data="{\\"requestId\\": $(decode_log.requestId), \\"payment\\": $(decode_log.payment), \\"callbackAddress\\": $(decode_log.callbackAddr), \\"callbackFunctionId\\": $(decode_log.callbackFunctionId), \\"expiration\\": $(decode_log.cancelExpiration), \\"data\\": $(encode_data)}"]

    submit_tx    [type="ethtx" to="YOUR_ORACLE_CONTRACT_ADDRESS" data="$(encode_tx)"]

    decode_log -> decode_cbor -> fetch -> parse -> encode_data -> encode_tx -> submit_tx
"""

